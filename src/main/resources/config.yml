# NinjaMinecraft configuration
# Reload with /ninjaminecraft reload
#
# Text uses MiniMessage format (https://docs.advntr.dev/minimessage/format.html).
# Placeholders available in the tab list and scoreboard:
#   <tps_1m> <tps_5m> <tps_15m>  - colour-coded TPS averaged over 1, 5 and 15 minutes
#   <mspt>                       - colour-coded average milliseconds per tick (last 100 ticks)
#   <mspt_max>                   - colour-coded worst tick in the last 100 ticks
#   <tps_bar>                    - 20-segment bar of the 1m TPS (full = 20 TPS)
#   <mspt_bar>                   - 20-segment bar of tick load (full = the whole 50 ms budget)
#   <online> <max_players>       - player counts
#   <ping>                       - colour-coded ping of the viewing player, in ms (number only)
#   <day>                        - day number in the main world (same as /time query day)
#   <time>                       - in-game clock in the main world, e.g. 06:00
#   <time_icon>                  - yellow sun by day, blue moon by night
#   <weather>                    - Clear, Rain or Thunder in the main world
#   <weather_icon>               - matching icon: sparkle, umbrella or lightning bolt

# How often the tab list and scoreboard refresh, in ticks (20 ticks = 1 second).
update-interval-ticks: 20

tablist:
  enabled: true
  # Shown to players who haven't used /subscribe tablist yet.
  default-subscribed: true
  header: "<gray>TPS <dark_gray>1m</dark_gray> <tps_1m>  <dark_gray>5m</dark_gray> <tps_5m>  <dark_gray>15m</dark_gray> <tps_15m>"
  footer: "<gray>MSPT <mspt> <dark_gray>(max <mspt_max><dark_gray>)</dark_gray>  <gray>Ping <ping><gray>ms"

scoreboard:
  enabled: true
  # Shown to players who haven't used /subscribe scoreboard yet.
  default-subscribed: true
  # Note: each subscribed player gets their own scoreboard, so they won't see objectives or
  # team colours from the server's main scoreboard (e.g. ones made with /scoreboard or /team).
  title: "<gradient:#FF9A3C:#FFD93C><bold>✦ SERVER ✦</bold></gradient>"
  # Up to 15 lines. Empty strings make blank spacer lines.
  # "<st>" over spaces draws a divider; add or remove spaces to change its width.
  lines:
    - "<dark_gray><st>                         </st>"
    - "<gold><bold>World"
    - " <time_icon> <gray>Day <white><day> <gray>· <white><time>"
    - " <weather_icon> <gray><weather>"
    - ""
    - "<gold><bold>Players"
    - " <gray>▸ <gray>Online <white><online><dark_gray>/</dark_gray><max_players>"
    - " <gray>▸ <gray>Ping <ping><gray>ms"
    - ""
    - "<gold><bold>Performance"
    - " <gray>▸ <gray>TPS <tps_1m>"
    - "   <tps_bar>"
    - " <gray>▸ <gray>MSPT <mspt>"
    - "   <mspt_bar>"
    - "<dark_gray><st>                         </st>"

difficulty:
  # Let every player use /difficulty without being OP.
  # Note: difficulty is global, so any player can change it for the whole server.
  allow-everyone: true

sleep:
  # The night skip is done by vanilla itself, through the players_sleeping_percentage gamerule:
  # vanilla still waits for sleepers to be fully asleep, wakes everyone, clears rain and resets
  # phantom timers. This plugin only sets the gamerule and adds the chat messages below.
  #
  # Set the gamerule on every world from "percentage" below. Turn off to manage it per world
  # yourself with /gamerule players_sleeping_percentage.
  manage-gamerule: true
  # Percentage of players in the world (spectators don't count) who must sleep to skip the night.
  # Vanilla rounds up and always needs at least one, so 0 means one player is enough.
  # Vanilla's default is 100. Change in-game with /ninjaminecraft sleep percentage <0-100> (OP only).
  percentage: 0
  messages:
    # Toggle in-game with /ninjaminecraft sleep messages <on|off> (OP only).
    enabled: true
    # Placeholders: <player> (who got in bed), <sleeping>, <needed>, <world>,
    # and <players> (everyone who slept) in the skipped messages.
    sleeping: "<blue>☽</blue> <white><player></white> <gray>is sleeping <dark_gray>(<white><sleeping></white>/<white><needed></white>)"
    skipping-night: "<gray>Enough players are sleeping. <white>Skipping the night...</white>"
    skipping-storm: "<gray>Enough players are sleeping. <white>Skipping the storm...</white>"
    skipped-night: "<yellow>☀</yellow> <gold>Good morning!</gold> <gray>Night skipped by <white><players></white>."
    skipped-storm: "<aqua>☂</aqua> <gray>The storm was skipped by <white><players></white>."
    cancelled: "<gray>Not enough players are sleeping any more. The night carries on."
