name: NinjaMinecraft
version: '${version}'
main: nz.ninjagoldfinch.minecraft.NinjaMinecraft
description: TPS/MSPT tab list, a stats scoreboard with /subscribe opt in/out, sleep messages on top of vanilla sleeping, and /difficulty without OP.
author: NinjaGoldfinch
api-version: '26.3'

permissions:
  ninjaminecraft.subscribe:
    description: Allows /subscribe to turn the tab list and scoreboard on or off for yourself
    default: true
  ninjaminecraft.reload:
    description: Allows /ninjaminecraft reload
    default: op
  ninjaminecraft.sleep.admin:
    description: Allows /ninjaminecraft sleep to change the sleep percentage and messages
    default: op
